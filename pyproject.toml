[project]
name = "kantoku-agent"
version = "0.0.1"
description = "kantoku-agent：AI 漫剧副导演，本地创作工作台"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
dependencies = [
    "openai>=1.40",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "loguru>=0.7",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "volcengine>=1.0.222,<2",
    "pillow>=11.3,<14",
    "tos>=2.8,<3",
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
    "swagger-ui-bundle-v2>=5.31.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.ruff]
line-length = 100
target-version = "py311"
cache-dir = "cache/ruff"
# 排除 AI 协作工作目录：其中的 .py 是一次性取色/测量/截图脚本，
# 不属于项目源码，不应进入 lint 门禁（详见 AGENTS.md 的完成标准）。
exclude = [".workbuddy", "frontend"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
cache_dir = "cache/pytest"

[tool.uv]
cache-dir = "cache/uv"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kantoku"]
