name: Kantoku checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the documented environment manager
        run: python -m pip install uv
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Check project structure
        run: uv run --locked python -B scripts/check_structure.py
      - name: Run selected offline backend checks
        run: >-
          uv run --locked python -B -m pytest
          tests/test_core_runtime.py tests/test_comic_image_review.py
          tests/test_comic_prompt_production.py tests/test_evaluation.py
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
